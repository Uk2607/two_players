# ==============================================================
# Render.com Blueprint — Two Players Single-Service Monolith
# ==============================================================
services:
  - type: web
    name: two-players
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
